<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gorilla Locomotion</title>
<style>
    html,body {
        margin:0;
        width:100%;
        height:100%;
        overflow:hidden;
        background:#111;
    }

    canvas {
        display:block;
    }

    #settings {
        position:fixed;
        top:15px;
        left:15px;
        z-index:10;
        padding:12px;
        color:white;
        background:#111c;
        border-radius:8px;
        font-family:Arial,sans-serif;
    }

    #settings input {
        width:130px;
    }
</style>
</head>

<body>

<div id="settings">
    Fur color<br>
    R <input id="r" type="range" min="0" max="255" value="80"><br>
    G <input id="g" type="range" min="0" max="255" value="120"><br>
    B <input id="b" type="range" min="0" max="255" value="80">
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";

import { PointerLockControls } from
"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/controls/PointerLockControls.js";

/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

    gravity: -24,

    // Maximum player speed.
    terminalVelocity: 13,

    // How strongly a hand push affects the body.
    pushStrength: 2.25,

    // Maximum hand-to-surface distance.
    handReach: 2.5,

    // Wall bounce multiplier.
    wallBounce: 1.5,

    // Time after touching wall during which
    // the enhanced bounce is possible.
    wallBounceWindow: 0.5,

    // Almost-zero ice friction.
    iceFriction: 0.015,

    // Normal ground friction is intentionally tiny.
    groundFriction: 0.02,

    handImpactVelocity: 4
};

/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x88b9d8);

scene.fog = new THREE.Fog(
    0x88b9d8,
    20,
    90
);

const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    0.05,
    200
);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   LIGHTING
========================================================= */

scene.add(
    new THREE.HemisphereLight(
        0xaad8ff,
        0x304020,
        2
    )
);

const sun = new THREE.DirectionalLight(
    0xffffff,
    2.5
);

sun.position.set(
    20,
    40,
    15
);

sun.castShadow = true;

scene.add(sun);

/* =========================================================
   LOW POLY TEXTURES
========================================================= */

function createPixelTexture(
    colors,
    size = 32
) {

    const canvas =
        document.createElement("canvas");

    canvas.width = size;
    canvas.height = size;

    const ctx =
        canvas.getContext("2d");

    const pixel = 4;

    for(let y=0;y<size;y+=pixel) {

        for(let x=0;x<size;x+=pixel) {

            const color =
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ];

            ctx.fillStyle = color;

            ctx.fillRect(
                x,
                y,
                pixel,
                pixel
            );
        }
    }

    const texture =
        new THREE.CanvasTexture(canvas);

    texture.magFilter =
        THREE.NearestFilter;

    texture.minFilter =
        THREE.NearestFilter;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    return texture;
}

const grassTexture =
    createPixelTexture([
        "#315d28",
        "#3d7130",
        "#4c8038",
        "#274b22",
        "#588c3e"
    ]);

grassTexture.repeat.set(12,12);

const barkTexture =
    createPixelTexture([
        "#5a341d",
        "#704122",
        "#824d28",
        "#4a2918"
    ]);

barkTexture.repeat.set(3,6);

const stoneTexture =
    createPixelTexture([
        "#363a3d",
        "#41464a",
        "#292d30",
        "#50565a"
    ]);

stoneTexture.repeat.set(4,4);

/* =========================================================
   WORLD
========================================================= */

const colliders = [];
const iceSurfaces = [];

function createSurface(
    size,
    position,
    material,
    type = "normal"
) {

    const geometry =
        new THREE.BoxGeometry(
            size.x,
            size.y,
            size.z
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.copy(position);

    mesh.receiveShadow = true;
    mesh.castShadow = true;

    mesh.userData.surfaceType = type;

    scene.add(mesh);

    colliders.push(mesh);

    if(type === "ice")
        iceSurfaces.push(mesh);

    return mesh;
}

/* Grass */

const grassMaterial =
    new THREE.MeshStandardMaterial({
        map:grassTexture,
        roughness:1
    });

createSurface(
    new THREE.Vector3(80,1,80),
    new THREE.Vector3(0,-0.5,0),
    grassMaterial
);

/* =========================================================
   TREES
========================================================= */

const barkMaterial =
    new THREE.MeshStandardMaterial({
        map:barkTexture,
        roughness:1
    });

function createTree(x,z) {

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                1.1,
                1.5,
                14,
                8
            ),
            barkMaterial
        );

    trunk.position.set(
        x,
        7,
        z
    );

    trunk.castShadow = true;

    scene.add(trunk);

    colliders.push(trunk);

    const leaves =
        new THREE.Mesh(
            new THREE.IcosahedronGeometry(
                5,
                1
            ),
            new THREE.MeshStandardMaterial({
                color:0x28632b,
                flatShading:true
            })
        );

    leaves.position.set(
        x,
        15,
        z
    );

    leaves.castShadow = true;

    scene.add(leaves);
}

for(let i=0;i<20;i++) {

    createTree(
        (Math.random()-0.5)*65,
        (Math.random()-0.5)*65
    );
}

/* =========================================================
   WALLS
========================================================= */

const stoneMaterial =
    new THREE.MeshStandardMaterial({
        map:stoneTexture,
        roughness:0.95
    });

createSurface(
    new THREE.Vector3(80,15,1),
    new THREE.Vector3(0,7.5,-40),
    stoneMaterial
);

createSurface(
    new THREE.Vector3(80,15,1),
    new THREE.Vector3(0,7.5,40),
    stoneMaterial
);

createSurface(
    new THREE.Vector3(1,15,80),
    new THREE.Vector3(-40,7.5,0),
    stoneMaterial
);

createSurface(
    new THREE.Vector3(1,15,80),
    new THREE.Vector3(40,7.5,0),
    stoneMaterial
);

/* =========================================================
   ICE SURFACE
========================================================= */

const iceMaterial =
    new THREE.MeshStandardMaterial({
        color:0x8bdfff,
        transparent:true,
        opacity:0.7,
        roughness:0.05,
        metalness:0.1
    });

createSurface(
    new THREE.Vector3(18,0.2,12),
    new THREE.Vector3(8,0.1,8),
    iceMaterial,
    "ice"
);

/* =========================================================
   GORILLA
========================================================= */

const gorilla =
    new THREE.Group();

scene.add(gorilla);

gorilla.position.set(
    0,
    2,
    0
);

const furMaterial =
    new THREE.MeshStandardMaterial({
        color:0x508050,
        roughness:1
    });

/* Torso */

const torso =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            0.65,
            1.1,
            8,
            12
        ),
        furMaterial
    );

torso.scale.set(
    1.1,
    1.2,
    0.8
);

torso.castShadow = true;

gorilla.add(torso);

/* Head */

const head =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.55,
            12,
            8
        ),
        furMaterial
    );

head.position.y = 1.2;

head.castShadow = true;

gorilla.add(head);

/* =========================================================
   ARMS
========================================================= */

function createArm() {

    const arm =
        new THREE.Group();

    const upper =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.22,
                0.3,
                1.25,
                8
            ),
            furMaterial
        );

    upper.position.y = -0.6;

    arm.add(upper);

    const fore =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.18,
                0.25,
                1.25,
                8
            ),
            furMaterial
        );

    fore.position.y = -1.8;

    arm.add(fore);

    const hand =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.28,
                10,
                8
            ),
            furMaterial
        );

    hand.position.y = -2.45;

    arm.add(hand);

    return arm;
}

const leftArm =
    createArm();

const rightArm =
    createArm();

leftArm.position.set(
    -0.65,
    0.65,
    0
);

rightArm.position.set(
    0.65,
    0.65,
    0
);

gorilla.add(leftArm);
gorilla.add(rightArm);

/* =========================================================
   PLAYER PHYSICS
========================================================= */

const velocity =
    new THREE.Vector3();

const bodyPosition =
    gorilla.position;

let grounded = false;

let currentSurface = null;

let lastWallHit = -Infinity;

let lastFrame =
    performance.now();

/* =========================================================
   MOUSE / HAND INPUT
========================================================= */

const mouse =
    new THREE.Vector2();

const previousMouse =
    new THREE.Vector2();

let mouseDown = false;

let dragStart =
    new THREE.Vector2();

let dragStartTime = 0;

let activeHand = null;

renderer.domElement.addEventListener(
    "mousedown",
    e => {

        mouseDown = true;

        dragStart.set(
            e.clientX,
            e.clientY
        );

        previousMouse.copy(
            dragStart
        );

        dragStartTime =
            performance.now();

        activeHand =
            e.button === 0
                ? leftArm
                : rightArm;
    }
);

window.addEventListener(
    "mouseup",
    e => {

        if(!mouseDown)
            return;

        mouseDown = false;

        const now =
            performance.now();

        const dt =
            Math.max(
                (now-dragStartTime)/1000,
                0.001
            );

        const drag =
            new THREE.Vector2(
                e.clientX -
                    dragStart.x,
                e.clientY -
                    dragStart.y
            );

        /*
         * Mouse movement becomes a body impulse.
         *
         * The direction is deliberately inverted:
         *
         * Hand -> BACK
         * Body -> FORWARD
         */

        const dragVelocity =
            drag.length()/dt;

        if(dragVelocity < 1)
            return;

        const cameraForward =
            new THREE.Vector3();

        camera.getWorldDirection(
            cameraForward
        );

        cameraForward.y = 0;

        cameraForward.normalize();

        const cameraRight =
            new THREE.Vector3()
                .crossVectors(
                    cameraForward,
                    new THREE.Vector3(0,1,0)
                )
                .normalize();

        const input =
            cameraRight
                .multiplyScalar(
                    drag.x
                )
                .add(
                    cameraForward
                        .multiplyScalar(
                            -drag.y
                        )
                );

        if(input.lengthSq() === 0)
            return;

        input.normalize();

        /*
         * Gorilla Tag style:
         * pushing hand backward launches
         * the body forward.
         */

        let impulse =
            dragVelocity *
            CONFIG.pushStrength;

        /*
         * Wall bounce.
         */

        const nowSeconds =
            performance.now()/1000;

        if(
            nowSeconds-lastWallHit <=
            CONFIG.wallBounceWindow
        ) {

            impulse *=
                CONFIG.wallBounce;
        }

        velocity.add(
            input.multiplyScalar(
                impulse
            )
        );

        clampVelocity();
    }
);

/* =========================================================
   VELOCITY CAP
========================================================= */

function clampVelocity() {

    const horizontal =
        new THREE.Vector3(
            velocity.x,
            0,
            velocity.z
        );

    if(
        horizontal.length() >
        CONFIG.terminalVelocity
    ) {

        horizontal.setLength(
            CONFIG.terminalVelocity
        );

        velocity.x =
            horizontal.x;

        velocity.z =
            horizontal.z;
    }

    velocity.y =
        THREE.MathUtils.clamp(
            velocity.y,
            -CONFIG.terminalVelocity,
            CONFIG.terminalVelocity
        );
}

/* =========================================================
   COLLISION
========================================================= */

const playerBox =
    new THREE.Box3();

const surfaceBox =
    new THREE.Box3();

function checkCollisions() {

    grounded = false;

    currentSurface = null;

    const playerRadius = 0.7;

    playerBox.setFromCenterAndSize(
        bodyPosition,
        new THREE.Vector3(
            playerRadius*2,
            2.4,
            playerRadius*2
        )
    );

    for(const surface of colliders) {

        surfaceBox.setFromObject(
            surface
        );

        if(!playerBox.intersectsBox(
            surfaceBox
        ))
            continue;

        currentSurface =
            surface;

        const center =
            surfaceBox.getCenter(
                new THREE.Vector3()
            );

        const difference =
            bodyPosition.clone()
                .sub(center);

        const half =
            surfaceBox.getSize(
                new THREE.Vector3()
            ).multiplyScalar(0.5);

        /*
         * Vertical collision.
         */

        if(
            bodyPosition.y >
            center.y
        ) {

            const top =
                center.y + half.y;

            if(
                bodyPosition.y <
                top + 1.2
            ) {

                bodyPosition.y =
                    top + 1.2;

                if(
                    velocity.y < 0
                )
                    velocity.y = 0;

                grounded = true;
            }
        }

        /*
         * Horizontal wall collision.
         */

        if(!grounded) {

            if(
                Math.abs(difference.x) >
                Math.abs(difference.z)
            ) {

                velocity.x *= -1;

                velocity.x *=
                    CONFIG.wallBounce;

                lastWallHit =
                    performance.now()/1000;
            }
            else {

                velocity.z *= -1;

                velocity.z *=
                    CONFIG.wallBounce;

                lastWallHit =
                    performance.now()/1000;
            }
        }
    }
}

/* =========================================================
   ICE PHYSICS
========================================================= */

function applySurfacePhysics(dt) {

    if(!currentSurface)
        return;

    const ice =
        currentSurface.userData
            .surfaceType === "ice";

    if(ice) {

        /*
         * Preserve momentum.
         * Only a tiny amount is removed.
         */

        velocity.multiplyScalar(
            Math.pow(
                1-CONFIG.iceFriction,
                dt*60
            )
        );

        return;
    }

    /*
     * Normal surfaces have extremely
     * little friction.
     */

    if(grounded) {

        velocity.x *=
            Math.pow(
                1-CONFIG.groundFriction,
                dt*60
            );

        velocity.z *=
            Math.pow(
                1-CONFIG.groundFriction,
                dt*60
            );
    }
}

/* =========================================================
   HAND REACH
========================================================= */

const raycaster =
    new THREE.Raycaster();

function updateHands() {

    if(!mouseDown)
        return;

    mouse.x =
        (previousMouse.x /
            innerWidth)*2-1;

    mouse.y =
        -(previousMouse.y /
            innerHeight)*2+1;

    raycaster.setFromCamera(
        mouse,
        camera
    );

    const hits =
        raycaster.intersectObjects(
            colliders,
            true
        );

    if(!hits.length)
        return;

    const hit =
        hits[0];

    const target =
        hit.point.clone();

    const local =
        gorilla.worldToLocal(
            target
        );

    if(local.length() >
        CONFIG.handReach)
    {
        local.setLength(
            CONFIG.handReach
        );
    }

    if(activeHand) {

        activeHand.position.y =
            Math.max(
                -2.6,
                local.y
            );

        activeHand.position.x =
            local.x;

        activeHand.position.z =
            local.z;
    }

    previousMouse.set(
        dragStart.x,
        dragStart.y
    );
}

/* =========================================================
   SURFACE PARTICLES
========================================================= */

function impactParticles(
    position,
    color
) {

    const geometry =
        new THREE.BufferGeometry();

    const count = 15;

    const positions =
        new Float32Array(
            count*3
        );

    for(let i=0;i<count;i++) {

        positions[i*3] =
            position.x;

        positions[i*3+1] =
            position.y;

        positions[i*3+2] =
            position.z;
    }

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    const material =
        new THREE.PointsMaterial({
            color,
            size:0.08
        });

    const particles =
        new THREE.Points(
            geometry,
            material
        );

    scene.add(particles);

    setTimeout(() => {

        scene.remove(
            particles
        );

    },150);
}

/* =========================================================
   FUR COLOR UI
========================================================= */

function updateFur() {

    const r =
        Number(
            document.getElementById("r")
                .value
        );

    const g =
        Number(
            document.getElementById("g")
                .value
        );

    const b =
        Number(
            document.getElementById("b")
                .value
        );

    furMaterial.color.setRGB(
        r/255,
        g/255,
        b/255
    );
}

["r","g","b"].forEach(
    id => {

        document.getElementById(id)
            .addEventListener(
                "input",
                updateFur
            );
    }
);

/* =========================================================
   CAMERA
========================================================= */

camera.position.set(
    0,
    2,
    6
);

const controls =
    new PointerLockControls(
        camera,
        renderer.domElement
    );

renderer.domElement.addEventListener(
    "click",
    () => {

        if(!controls.isLocked)
            controls.lock();

    }
);

/* =========================================================
   GAME LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    const now =
        performance.now();

    let dt =
        (now-lastFrame)/1000;

    lastFrame = now;

    dt =
        Math.min(dt,0.033);

    /*
     * Gravity.
     */

    velocity.y +=
        CONFIG.gravity*dt;

    /*
     * Integrate velocity.
     */

    bodyPosition.addScaledVector(
        velocity,
        dt
    );

    /*
     * Resolve collisions.
     */

    checkCollisions();

    /*
     * Surface-specific physics.
     */

    applySurfacePhysics(dt);

    /*
     * Terminal velocity.
     */

    clampVelocity();

    /*
     * Camera follows body.
     */

    camera.position.copy(
        bodyPosition
    );

    camera.position.y +=
        0.8;

    /*
     * Gorilla faces camera direction.
     */

    const direction =
        new THREE.Vector3();

    camera.getWorldDirection(
        direction
    );

    direction.y = 0;

    if(direction.lengthSq()>0) {

        gorilla.rotation.y =
            Math.atan2(
                direction.x,
                direction.z
            );
    }

    updateHands();

    renderer.render(
        scene,
        camera
    );
}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>
</body>
</html>
