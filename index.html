<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jungle Rush</title>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div id="menu">
        <div class="menu-box">

            <div class="logo">
                JUNGLE RUSH
            </div>

            <div class="subtitle">
                FAN-MADE JUNGLE TAG
            </div>

            <button id="playButton">
                PLAY
            </button>

            <button id="vrButton">
                ENTER VR
            </button>

            <button id="settingsButton">
                SETTINGS
            </button>

            <div class="controls">
                <b>Desktop Controls</b>

                <br><br>

                WASD — Move

                <br>

                Mouse — Look

                <br>

                Space — Jump

                <br>

                ESC — Unlock Mouse
            </div>

        </div>
    </div>


    <div id="settings">
        <div class="settings-box">

            <h2>SETTINGS</h2>

            <label>
                Mouse Sensitivity
            </label>

            <input
                id="sensitivity"
                type="range"
                min="0.2"
                max="2"
                step="0.05"
                value="1"
            >

            <label>
                Player Color
            </label>

            <input
                id="playerColor"
                type="color"
                value="#9148d8"
            >

            <button id="closeSettings">
                BACK
            </button>

        </div>
    </div>


    <div id="hud">

        <div class="hud-box">

            <b>JUNGLE RUSH</b>

            <br>

            Mode:
            <span id="modeText">
                INFECTION
            </span>

            <br>

            Status:
            <span id="statusText">
                RUNNER
            </span>

            <br>

            Players:
            <span id="playerCount">
                5
            </span>

            <br>

            Time:
            <span id="timer">
                05:00
            </span>

        </div>

    </div>


    <div id="crosshair">
        +
    </div>


    <div id="message"></div>


    <div id="loading">
        Loading Jungle Rush...
    </div>


    <div id="error"></div>


    <script
        type="module"
        src="./main.js">
    </script>

</body>
</html>
