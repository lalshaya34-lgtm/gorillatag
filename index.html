<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jungle Climb 3D</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#8bd5ff;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  left:16px;
  top:16px;
  z-index:20;
  color:white;
  background:rgba(0,0,0,.55);
  padding:14px 18px;
  border-radius:12px;
  line-height:1.5;
  pointer-events:none;
}

#hud b{
  color:#79ff70;
  font-size:18px;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  width:6px;
  height:6px;
  margin:-3px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 5px #000;
  z-index:10;
  pointer-events:none;
}

#start{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.55);
  color:white;
  text-align:center;
}

#startBox{
  background:#172018;
  padding:30px;
  border-radius:18px;
  max-width:430px;
  box-shadow:0 15px 50px #0008;
}

#startButton{
  border:0;
  border-radius:12px;
  padding:14px 24px;
  background:#54d64f;
  color:#071007;
  font-weight:bold;
  font-size:17px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="hud">
  <b>Jungle Climb 3D</b><br>
  WASD — move<br>
  Mouse — look + control hands<br>
  Hold mouse buttons — grab/push<br>
  Space — jump<br>
  R — respawn<br>
  ESC — release mouse
</div>

<div id="crosshair"></div>

<div id="start">
  <div id="startBox">
    <h1>🦍 Jungle Climb 3D</h1>
    <p>
      Click start, then use your mouse to look around.
      Your hands follow your mouse.
    </p>
    <p>
      Push your hands against surfaces to move around
      the arena.
    </p>
    <button id="startButton">START GAME</button>
  </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";


// ============================================================
// SCENE
// ============================================================

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x8bd5ff);

scene.fog =
new THREE.Fog(
  0x8bd5ff,
  25,
  110
);


// ============================================================
// CAMERA
// ============================================================

const camera =
new THREE.PerspectiveCamera(
  75,
  innerWidth / innerHeight,
  .03,
  250
);

camera.position.set(
  0,
  1.1,
  0
);


// ============================================================
// RENDERER
// ============================================================

const renderer =
new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=
THREE.PCFSoftShadowMap;

document.body.appendChild(
  renderer.domElement
);


// ============================================================
// LIGHTING
// ============================================================

const sun =
new THREE.DirectionalLight(
  0xffffff,
  2.2
);

sun.position.set(
  30,
  45,
  20
);

sun.castShadow=true;

sun.shadow.mapSize.set(
  2048,
  2048
);

sun.shadow.camera.left=-50;
sun.shadow.camera.right=50;
sun.shadow.camera.top=50;
sun.shadow.camera.bottom=-50;

scene.add(sun);


scene.add(
  new THREE.HemisphereLight(
    0xcff3ff,
    0x253b18,
    1.6
  )
);


// ============================================================
// MATERIALS
// ============================================================

const grassMat =
new THREE.MeshStandardMaterial({
  color:0x3f9c43,
  roughness:1
});

const dirtMat =
new THREE.MeshStandardMaterial({
  color:0x754a2c,
  roughness:1
});

const rockMat =
new THREE.MeshStandardMaterial({
  color:0x777b78,
  roughness:1
});

const woodMat =
new THREE.MeshStandardMaterial({
  color:0x704122,
  roughness:1
});

const leafMat =
new THREE.MeshStandardMaterial({
  color:0x1d7d34,
  roughness:1
});

const playerMat =
new THREE.MeshStandardMaterial({
  color:0x985c36,
  roughness:.9
});


// ============================================================
// WORLD COLLIDERS
// ============================================================

const colliders=[];

function addBox(
  x,y,z,
  sx,sy,sz,
  material,
  climbable=true
){

  const mesh =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      sx,sy,sz
    ),
    material
  );

  mesh.position.set(
    x,y,z
  );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  mesh.userData.climbable=
  climbable;

  scene.add(mesh);

  colliders.push(mesh);

  return mesh;
}


// ============================================================
// GROUND
// ============================================================

addBox(
  0,-.5,0,
  100,1,100,
  grassMat,
  false
);


// ============================================================
// ARENA PLATFORMS
// ============================================================

addBox(
  0,2,-5,
  7,.6,7,
  dirtMat
);

addBox(
  -8,4,-10,
  6,.6,6,
  rockMat
);

addBox(
  9,5,-13,
  6,.6,6,
  dirtMat
);

addBox(
  -3,7,-20,
  8,.6,8,
  rockMat
);

addBox(
  10,9,-25,
  7,.6,7,
  dirtMat
);

addBox(
  -13,7,-25,
  7,.6,7,
  rockMat
);


// ============================================================
// WALLS
// ============================================================

addBox(
  -18,6,-20,
  1,12,35,
  rockMat
);

addBox(
  18,6,-20,
  1,12,35,
  rockMat
);


// ============================================================
// TREE CREATOR
// ============================================================

function createTree(x,z,scale=1){

  const trunk =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .55*scale,
      .8*scale,
      7*scale,
      12
    ),
    woodMat
  );

  trunk.position.set(
    x,
    3.5*scale,
    z
  );

  trunk.castShadow=true;

  scene.add(trunk);

  colliders.push(trunk);


  for(let i=0;i<7;i++){

    const leaves =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        1.7*scale,
        14,
        14
      ),
      leafMat
    );

    leaves.position.set(
      x+(Math.random()-.5)*3*scale,
      6*scale+
      Math.random()*3*scale,
      z+(Math.random()-.5)*3*scale
    );

    leaves.castShadow=true;

    scene.add(leaves);
  }
}


createTree(-12,3,1.1);
createTree(13,3,1.2);
createTree(-14,-12,1);
createTree(14,-18,1.1);
createTree(-8,-30,1.3);
createTree(12,-35,1.2);


// ============================================================
// PLAYER
// ============================================================

const player =
new THREE.Group();

player.position.set(
  0,
  2.5,
  8
);

scene.add(player);


// Camera is attached to player.

player.add(camera);

camera.position.set(
  0,
  .85,
  0
);


// ============================================================
// BODY
// ============================================================

const body =
new THREE.Mesh(
  new THREE.SphereGeometry(
    .55,
    24,
    20
  ),
  playerMat
);

body.scale.set(
  .9,
  1.2,
  .8
);

body.position.y=-.45;

body.castShadow=true;

player.add(body);


// ============================================================
// HEAD
// ============================================================

const head =
new THREE.Mesh(
  new THREE.SphereGeometry(
    .38,
    20,
    20
  ),
  playerMat
);

head.position.y=.25;

head.castShadow=true;

player.add(head);


// ============================================================
// EARS
// ============================================================

function makeEar(){

  const ear =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .13,
      12,
      12
    ),
    playerMat
  );

  ear.castShadow=true;

  return ear;
}

const earL=makeEar();
const earR=makeEar();

earL.position.set(
  -.35,.27,0
);

earR.position.set(
  .35,.27,0
);

player.add(earL);
player.add(earR);


// ============================================================
// HANDS
// ============================================================

function makeHand(){

  const hand =
  new THREE.Group();

  const palm =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .19,
      16,
      16
    ),
    playerMat
  );

  palm.scale.set(
    1,.85,.7
  );

  palm.castShadow=true;

  hand.add(palm);

  return hand;
}

const leftHand=
makeHand();

const rightHand=
makeHand();

player.add(leftHand);
player.add(rightHand);


// ============================================================
// ARM CREATION
// ============================================================

function makeArm(){

  const arm =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .12,
      .18,
      1.2,
      12
    ),
    playerMat
  );

  arm.castShadow=true;

  return arm;
}

const leftArm=
makeArm();

const rightArm=
makeArm();

player.add(leftArm);
player.add(rightArm);


// ============================================================
// INPUT
// ============================================================

const keys={};

addEventListener(
  "keydown",
  e=>{
    keys[e.code]=true;

    if(e.code==="KeyR"){
      respawn();
    }

    if(
      e.code==="Space" &&
      grounded
    ){

      velocity.y=7.5;
      grounded=false;
    }
  }
);

addEventListener(
  "keyup",
  e=>{
    keys[e.code]=false;
  }
);


// ============================================================
// MOUSE
// ============================================================

let yaw=0;
let pitch=0;

let mouseX=0;
let mouseY=0;

let mouseLeft=false;
let mouseRight=false;

document.addEventListener(
  "mousemove",
  e=>{

    if(
      document.pointerLockElement !==
      renderer.domElement
    ) return;

    yaw -= e.movementX*.0025;

    pitch -= e.movementY*.0025;

    pitch =
    THREE.MathUtils.clamp(
      pitch,
      -1.35,
      1.35
    );

    mouseX =
    THREE.MathUtils.clamp(
      mouseX+e.movementX*.002,
      -1.4,
      1.4
    );

    mouseY =
    THREE.MathUtils.clamp(
      mouseY-e.movementY*.002,
      -1.2,
      1.2
    );
  }
);

addEventListener(
  "mousedown",
  e=>{

    if(e.button===0)
      mouseLeft=true;

    if(e.button===2)
      mouseRight=true;
  }
);

addEventListener(
  "mouseup",
  e=>{

    if(e.button===0)
      mouseLeft=false;

    if(e.button===2)
      mouseRight=false;
  }
);

addEventListener(
  "contextmenu",
  e=>e.preventDefault()
);


// ============================================================
// START GAME
// ============================================================

const start =
document.getElementById(
  "start"
);

document.getElementById(
  "startButton"
).onclick=()=>{

  start.style.display="none";

  renderer.domElement.requestPointerLock();
};


// ============================================================
// PHYSICS
// ============================================================

const velocity =
new THREE.Vector3();

const gravity=-19;

let grounded=false;

const radius=.55;


// ============================================================
// MOVEMENT
// ============================================================

const move=
new THREE.Vector3();

function updateMovement(dt){

  move.set(0,0,0);

  if(keys.KeyW)
    move.z-=1;

  if(keys.KeyS)
    move.z+=1;

  if(keys.KeyA)
    move.x-=1;

  if(keys.KeyD)
    move.x+=1;


  if(move.lengthSq()>0){

    move.normalize();

    move.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      yaw
    );

    velocity.x +=
      move.x*11*dt;

    velocity.z +=
      move.z*11*dt;
  }


  // Air control is weaker.

  const friction=
    grounded ? .78 : .94;

  velocity.x *=
    Math.pow(
      friction,
      dt*60
    );

  velocity.z *=
    Math.pow(
      friction,
      dt*60
    );


  velocity.y +=
    gravity*dt;


  player.position.addScaledVector(
    velocity,
    dt
  );
}


// ============================================================
// PLATFORM COLLISION
// ============================================================

function collision(){

  grounded=false;

  const p=player.position;


  // Ground.

  if(p.y<radius){

    p.y=radius;

    if(velocity.y<0)
      velocity.y=0;

    grounded=true;
  }


  // Other objects.

  for(
    const object of colliders
  ){

    const box=
      new THREE.Box3()
      .setFromObject(object);


    // Ignore extremely large ground box.

    if(
      box.max.y < 1 &&
      box.getSize(
        new THREE.Vector3()
      ).x>50
    ){
      continue;
    }


    const closest=
      new THREE.Vector3();

    box.clampPoint(
      p,
      closest
    );

    const distance=
      p.distanceTo(closest);


    if(distance<radius){

      // Landing.

      if(
        p.y>=box.max.y-.6 &&
        velocity.y<=0
      ){

        p.y=
          box.max.y+
          radius;

        velocity.y=0;

        grounded=true;

        continue;
      }


      // Push away horizontally.

      const push=
        new THREE.Vector3()
        .subVectors(
          p,
          closest
        );

      push.y=0;


      if(push.lengthSq()>0){

        push.normalize();

        p.addScaledVector(
          push,
          radius-distance
        );
      }
    }
  }
}


// ============================================================
// MOUSE HAND POSITION
// ============================================================

const handTargetL=
new THREE.Vector3();

const handTargetR=
new THREE.Vector3();

function updateHands(dt){

  /*
    Hands are controlled by the mouse.

    Mouse movement changes X/Y.
    Camera direction controls depth.
  */


  const side=
    Math.sin(
      yaw
    );

  const forward=
    Math.cos(
      yaw
    );


  const lookX=
    Math.sin(yaw);

  const lookZ=
    -Math.cos(yaw);


  const handDepth=
    .75+
    mouseY*.25;


  // Left.

  handTargetL.set(
    -.65+
    mouseX*.55,
    -.2+
    mouseY*.55,
    -.55-handDepth*.15
  );


  // Right.

  handTargetR.set(
    .65+
    mouseX*.55,
    -.2+
    mouseY*.55,
    -.55-handDepth*.15
  );


  // Smooth movement.

  leftHand.position.lerp(
    handTargetL,
    1-Math.pow(.001,dt)
  );

  rightHand.position.lerp(
    handTargetR,
    1-Math.pow(.001,dt)
  );


  // Arms point toward hands.

  aimArm(
    leftArm,
    -.38,
    -.15,
    leftHand.position
  );

  aimArm(
    rightArm,
    .38,
    -.15,
    rightHand.position
  );
}


// ============================================================
// ARM AIMING
// ============================================================

function aimArm(
  arm,
  x,
  y,
  target
){

  const shoulder=
    new THREE.Vector3(
      x,
      y,
      -.05
    );

  const direction=
    new THREE.Vector3()
    .subVectors(
      target,
      shoulder
    );

  const length=
    direction.length();


  arm.position.copy(
    shoulder
    .add(
      direction.multiplyScalar(.5)
    )
  );

  arm.scale.y=
    Math.max(
      .5,
      length/1.2
    );


  arm.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    direction.normalize()
  );
}


// ============================================================
// HAND PUSH PHYSICS
// ============================================================

function handPush(){

  if(
    !mouseLeft &&
    !mouseRight
  ) return;


  /*
    Holding a mouse button makes the hand
    act like a contact point.

    If the hand gets pushed toward a nearby
    climbable surface, the player is pushed
    in the opposite direction.
  */


  const hands=[
    {
      hand:leftHand,
      active:mouseLeft
    },
    {
      hand:rightHand,
      active:mouseRight
    }
  ];


  for(
    const h of hands
  ){

    if(!h.active) continue;


    const worldPos=
      new THREE.Vector3();

    h.hand.getWorldPosition(
      worldPos
    );


    for(
      const object of colliders
    ){

      if(
        !object.userData.climbable
      ) continue;


      const box=
        new THREE.Box3()
        .setFromObject(object);


      const closest=
        new THREE.Vector3();

      box.clampPoint(
        worldPos,
        closest
      );


      const distance=
        worldPos.distanceTo(
          closest
        );


      if(distance<.28){

        const push=
          new THREE.Vector3()
          .subVectors(
            worldPos,
            closest
          );


        if(push.lengthSq()<.001)
          continue;


        push.normalize();


        velocity.x +=
          push.x*.65;

        velocity.y +=
          push.y*.65;

        velocity.z +=
          push.z*.65;
      }
    }
  }
}


// ============================================================
// HEAD / CAMERA
// ============================================================

function updateCamera(){

  player.rotation.y=
    yaw;

  camera.rotation.x=
    pitch;
}


// ============================================================
// FALL / RESPAWN
// ============================================================

function respawn(){

  player.position.set(
    0,
    3,
    8
  );

  velocity.set(
    0,
    0,
    0
  );

  yaw=0;
  pitch=0;
}


function checkDeath(){

  if(
    player.position.y < -12
  ){
    respawn();
  }
}


// ============================================================
// ARM SWING VISUAL EFFECT
// ============================================================

let animationTime=0;

function animateBody(dt){

  animationTime+=dt;

  const moving=
    move.lengthSq()>0;


  if(moving){

    const swing=
      Math.sin(
        animationTime*12
      )*.08;

    leftArm.rotation.z=
      swing;

    rightArm.rotation.z=
      -swing;

    body.rotation.z=
      swing*.35;

  }else{

    body.rotation.z=
      0;
  }
}


// ============================================================
// RESIZE
// ============================================================

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


// ============================================================
// GAME LOOP
// ============================================================

const clock=
new THREE.Clock();


function gameLoop(){

  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );


  updateMovement(dt);

  collision();

  handPush();

  updateHands(dt);

  updateCamera();

  animateBody(dt);

  checkDeath();


  renderer.render(
    scene,
    camera
  );
}


renderer.setAnimationLoop(
  gameLoop
);

</script>

</body>
</html>
