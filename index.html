<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jungle Climb</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #82d4ff;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    z-index: 10;
    left: 15px;
    top: 15px;

    color: white;
    background: rgba(0,0,0,.55);

    padding: 14px 17px;
    border-radius: 12px;

    line-height: 1.45;
    pointer-events: none;
}

#hud b {
    color: #75ff6e;
    font-size: 19px;
}

#crosshair {
    position: fixed;
    z-index: 11;

    left: 50%;
    top: 50%;

    width: 5px;
    height: 5px;

    margin: -2.5px;

    border-radius: 50%;
    background: white;

    box-shadow: 0 0 5px black;

    pointer-events: none;
}

#start {
    position: fixed;
    inset: 0;

    z-index: 30;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.65);

    color: white;
}

#panel {
    width: min(460px,90%);

    padding: 30px;

    text-align: center;

    border-radius: 20px;

    background: #172018;

    box-shadow: 0 20px 70px #0009;
}

#startButton {
    border: 0;

    padding: 14px 28px;

    border-radius: 12px;

    background: #55d94e;

    color: #071007;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;
}
</style>
</head>

<body>

<div id="hud">
    <b>Jungle Climb</b><br>
    Mouse = look<br>
    LMB = left hand grip<br>
    RMB = right hand grip<br>
    Move while gripping = push<br>
    Space = jump<br>
    R = respawn
</div>

<div id="crosshair"></div>

<div id="start">
    <div id="panel">
        <h1>🦍 Jungle Climb</h1>

        <p>
            Move around using your hands.
            Grab surfaces and push away to build
            momentum.
        </p>

        <p>
            WebXR controllers are supported when
            your browser/headset allows it.
        </p>

        <button id="startButton">
            START GAME
        </button>
    </div>
</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";

import { VRButton } from
"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/webxr/VRButton.js";


// ============================================================
// SCENE
// ============================================================

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x82d4ff);

scene.fog =
    new THREE.Fog(
        0x82d4ff,
        25,
        120
    );


// ============================================================
// CAMERA
// ============================================================

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth / innerHeight,
        .03,
        300
    );

camera.position.set(
    0,
    .85,
    0
);


// ============================================================
// RENDERER
// ============================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.xr.enabled = true;

document.body.appendChild(
    renderer.domElement
);

document.body.appendChild(
    VRButton.createButton(renderer)
);


// ============================================================
// LIGHTING
// ============================================================

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.4
    );

sun.position.set(
    25,
    45,
    20
);

sun.castShadow = true;

sun.shadow.mapSize.set(
    2048,
    2048
);

scene.add(sun);

scene.add(
    new THREE.HemisphereLight(
        0xd5f5ff,
        0x263e1c,
        1.5
    )
);


// ============================================================
// MATERIALS
// ============================================================

const grassMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x429b42,
        roughness: 1
    });

const dirtMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x70452b,
        roughness: 1
    });

const rockMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x747875,
        roughness: .95
    });

const woodMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x6d3f20,
        roughness: 1
    });

const leafMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x217a31,
        roughness: 1
    });

const playerMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x995c36,
        roughness: .95
    });


// ============================================================
// COLLIDERS
// ============================================================

const colliders = [];


function addBox(
    x,
    y,
    z,
    width,
    height,
    depth,
    material,
    climbable = true
) {

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    mesh.userData.climbable =
        climbable;

    scene.add(mesh);

    colliders.push(mesh);

    return mesh;
}


// ============================================================
// GROUND
// ============================================================

addBox(
    0,
    -.5,
    0,
    100,
    1,
    100,
    grassMaterial,
    false
);


// ============================================================
// ARENA
// ============================================================

addBox(
    0,
    2,
    -5,
    8,
    4,
    8,
    dirtMaterial
);

addBox(
    -9,
    3,
    -11,
    6,
    .7,
    6,
    rockMaterial
);

addBox(
    9,
    4,
    -14,
    6,
    .7,
    6,
    dirtMaterial
);

addBox(
    -2,
    6,
    -20,
    8,
    .7,
    8,
    rockMaterial
);

addBox(
    11,
    8,
    -26,
    7,
    .7,
    7,
    dirtMaterial
);

addBox(
    -12,
    9,
    -29,
    7,
    .7,
    7,
    rockMaterial
);


// ============================================================
// WALLS
// ============================================================

addBox(
    -18,
    7,
    -20,
    1,
    14,
    38,
    rockMaterial
);

addBox(
    18,
    7,
    -20,
    1,
    14,
    38,
    rockMaterial
);


// ============================================================
// TREES
// ============================================================

function createTree(
    x,
    z,
    scale = 1
) {

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .5 * scale,
                .75 * scale,
                7 * scale,
                12
            ),
            woodMaterial
        );

    trunk.position.set(
        x,
        3.5 * scale,
        z
    );

    trunk.castShadow = true;

    scene.add(trunk);

    /*
        Approximate tree trunk with a box-like
        collision volume so hand/body collision
        is stable.
    */

    const collider =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .6 * scale,
                .8 * scale,
                7 * scale,
                12
            )
        );

    collider.position.copy(
        trunk.position
    );

    collider.visible = false;

    collider.userData.climbable = true;

    scene.add(collider);

    colliders.push(collider);


    for(let i = 0; i < 7; i++) {

        const crown =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    1.6 * scale,
                    12,
                    12
                ),
                leafMaterial
            );

        crown.position.set(
            x +
            (Math.random() - .5) *
            3 * scale,

            6 * scale +
            Math.random() *
            3 * scale,

            z +
            (Math.random() - .5) *
            3 * scale
        );

        crown.castShadow = true;

        scene.add(crown);
    }
}

createTree(-12,4,1.1);
createTree(13,2,1.2);
createTree(-14,-13,1);
createTree(14,-19,1.1);
createTree(-8,-31,1.3);
createTree(12,-36,1.2);


// ============================================================
// PLAYER
// ============================================================

const player =
    new THREE.Group();

player.position.set(
    0,
    2.5,
    8
);

scene.add(player);


// ============================================================
// CAMERA
// ============================================================

player.add(camera);

camera.position.set(
    0,
    .85,
    0
);


// ============================================================
// BODY
// ============================================================

const body =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .55,
            24,
            20
        ),
        playerMaterial
    );

body.scale.set(
    .9,
    1.2,
    .8
);

body.position.y = -.45;

body.castShadow = true;

player.add(body);


// ============================================================
// HEAD
// ============================================================

const head =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .38,
            20,
            20
        ),
        playerMaterial
    );

head.position.y = .25;

head.castShadow = true;

player.add(head);


// ============================================================
// EARS
// ============================================================

function createEar() {

    const ear =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .14,
                12,
                12
            ),
            playerMaterial
        );

    ear.castShadow = true;

    return ear;
}

const leftEar = createEar();
const rightEar = createEar();

leftEar.position.set(
    -.35,
    .27,
    0
);

rightEar.position.set(
    .35,
    .27,
    0
);

player.add(leftEar);
player.add(rightEar);


// ============================================================
// HANDS
// ============================================================

function createHand() {

    const group =
        new THREE.Group();

    const palm =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .19,
                16,
                16
            ),
            playerMaterial
        );

    palm.scale.set(
        1,
        .85,
        .75
    );

    palm.castShadow = true;

    group.add(palm);

    return group;
}

const leftHand = createHand();
const rightHand = createHand();

player.add(leftHand);
player.add(rightHand);


// ============================================================
// ARMS
// ============================================================

function createArm() {

    const arm =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .11,
                .18,
                1,
                12
            ),
            playerMaterial
        );

    arm.castShadow = true;

    return arm;
}

const leftArm = createArm();
const rightArm = createArm();

player.add(leftArm);
player.add(rightArm);


// ============================================================
// PHYSICS
// ============================================================

const velocity =
    new THREE.Vector3();

const bodyRadius = .55;

const gravity = -19;

let grounded = false;


// ============================================================
// MOUSE STATE
// ============================================================

let yaw = 0;
let pitch = 0;

let leftGrip = false;
let rightGrip = false;

let mouseDX = 0;
let mouseDY = 0;


// ============================================================
// MOUSE LOOK
// ============================================================

document.addEventListener(
    "mousemove",
    event => {

        if(
            document.pointerLockElement !==
            renderer.domElement
        ) {
            return;
        }

        yaw -=
            event.movementX *
            .0025;

        pitch -=
            event.movementY *
            .0025;

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.35,
                1.35
            );

        mouseDX =
            event.movementX;

        mouseDY =
            event.movementY;
    }
);


// ============================================================
// MOUSE GRIP
// ============================================================

document.addEventListener(
    "mousedown",
    event => {

        if(event.button === 0)
            leftGrip = true;

        if(event.button === 2)
            rightGrip = true;
    }
);

document.addEventListener(
    "mouseup",
    event => {

        if(event.button === 0)
            leftGrip = false;

        if(event.button === 2)
            rightGrip = false;
    }
);

document.addEventListener(
    "contextmenu",
    event => {
        event.preventDefault();
    }
);


// ============================================================
// KEYBOARD
// ============================================================

document.addEventListener(
    "keydown",
    event => {

        if(event.code === "KeyR") {
            respawn();
        }

        if(
            event.code === "Space" &&
            grounded
        ) {

            velocity.y =
                Math.max(
                    velocity.y,
                    7
                );

            grounded = false;
        }
    }
);


// ============================================================
// START
// ============================================================

document
.getElementById("startButton")
.addEventListener(
    "click",
    () => {

        document
        .getElementById("start")
        .style.display =
            "none";

        renderer
        .domElement
        .requestPointerLock();
    }
);


// ============================================================
// HAND TARGETS
// ============================================================

const leftTarget =
    new THREE.Vector3();

const rightTarget =
    new THREE.Vector3();


function updateHands(dt) {

    /*
        Decay the mouse delta after using it.

        This prevents a single mouse movement
        from continuously applying force.
    */

    const dx = mouseDX;
    const dy = mouseDY;


    leftTarget.set(
        -.62 + dx * .012,
        -.18 - dy * .012,
        -.72
    );

    rightTarget.set(
        .62 + dx * .012,
        -.18 - dy * .012,
        -.72
    );


    leftTarget.x =
        THREE.MathUtils.clamp(
            leftTarget.x,
            -1.35,
            .15
        );

    rightTarget.x =
        THREE.MathUtils.clamp(
            rightTarget.x,
            -.15,
            1.35
        );


    leftTarget.y =
        THREE.MathUtils.clamp(
            leftTarget.y,
            -1.2,
            1.1
        );

    rightTarget.y =
        THREE.MathUtils.clamp(
            rightTarget.y,
            -1.2,
            1.1
        );


    const smoothing =
        1 - Math.pow(
            .0005,
            dt
        );


    leftHand.position.lerp(
        leftTarget,
        smoothing
    );

    rightHand.position.lerp(
        rightTarget,
        smoothing
    );


    updateArm(
        leftArm,
        leftHand.position,
        -.38
    );

    updateArm(
        rightArm,
        rightHand.position,
        .38
    );


    /*
        Slowly return mouse input to zero.
    */

    mouseDX *= .25;
    mouseDY *= .25;
}


// ============================================================
// ARM
// ============================================================

function updateArm(
    arm,
    target,
    shoulderX
) {

    const shoulder =
        new THREE.Vector3(
            shoulderX,
            -.15,
            -.05
        );

    const direction =
        new THREE.Vector3()
        .subVectors(
            target,
            shoulder
        );

    const length =
        THREE.MathUtils.clamp(
            direction.length(),
            .35,
            1.6
        );


    direction.normalize();


    arm.position.copy(
        shoulder
    );

    arm.position.add(
        direction.clone()
        .multiplyScalar(
            length * .5
        )
    );


    arm.scale.y =
        length;


    arm.quaternion =
        new THREE.Quaternion()
        .setFromUnitVectors(
            new THREE.Vector3(
                0,1,0
            ),
            direction
        );
}


// ============================================================
// CONTACT
// ============================================================

const worldPosition =
    new THREE.Vector3();

const nearestPoint =
    new THREE.Vector3();


function findContact(hand) {

    hand.getWorldPosition(
        worldPosition
    );


    let best = null;

    let bestDistance =
        Infinity;


    for(
        const object of colliders
    ) {

        if(
            object.userData.climbable !==
            true
        ) {
            continue;
        }


        const bounds =
            new THREE.Box3()
            .setFromObject(
                object
            );


        bounds.clampPoint(
            worldPosition,
            nearestPoint
        );


        const distance =
            worldPosition.distanceTo(
                nearestPoint
            );


        if(
            distance < bestDistance
        ) {

            bestDistance =
                distance;

            best = {
                point:
                    nearestPoint.clone(),

                distance
            };
        }
    }


    if(
        best &&
        best.distance < .42
    ) {
        return best;
    }


    return null;
}


// ============================================================
// ARM-BASED MOVEMENT
// ============================================================

function applyHandMovement() {

    const hands = [
        {
            hand: leftHand,
            gripping: leftGrip
        },
        {
            hand: rightHand,
            gripping: rightGrip
        }
    ];


    for(
        const item of hands
    ) {

        if(!item.gripping)
            continue;


        const contact =
            findContact(
                item.hand
            );


        if(!contact)
            continue;


        item.hand.getWorldPosition(
            worldPosition
        );


        const push =
            new THREE.Vector3()
            .subVectors(
                worldPosition,
                contact.point
            );


        /*
            If the hand is exactly inside
            the surface, don't normalize a
            zero vector.
        */

        if(
            push.lengthSq() <
            .000001
        ) {
            continue;
        }


        push.normalize();


        /*
            Physical push.

            Higher value = stronger movement.
        */

        velocity.addScaledVector(
            push,
            .48
        );


        /*
            Give the player a little extra
            lift when pushing upward.
        */

        if(push.y > .25) {

            velocity.y +=
                .08;
        }
    }
}


// ============================================================
// PHYSICS
// ============================================================

function updatePhysics(dt) {

    velocity.y +=
        gravity * dt;


    /*
        Momentum is intentionally preserved
        strongly while airborne.
    */

    const drag =
        grounded
        ? .82
        : .992;


    velocity.x *=
        Math.pow(
            drag,
            dt * 60
        );

    velocity.z *=
        Math.pow(
            drag,
            dt * 60
        );


    /*
        Prevent absurd browser physics speeds.
    */

    const horizontalSpeed =
        Math.hypot(
            velocity.x,
            velocity.z
        );

    const maximumSpeed = 18;


    if(
        horizontalSpeed >
        maximumSpeed
    ) {

        const multiplier =
            maximumSpeed /
            horizontalSpeed;

        velocity.x *=
            multiplier;

        velocity.z *=
            multiplier;
    }


    player.position.addScaledVector(
        velocity,
        dt
    );
}


// ============================================================
// COLLISION
// ============================================================

function resolveCollision() {

    grounded = false;


    const p =
        player.position;


    // Ground.

    if(
        p.y < bodyRadius
    ) {

        p.y =
            bodyRadius;

        if(
            velocity.y < 0
        ) {
            velocity.y = 0;
        }

        grounded = true;
    }


    for(
        const object of colliders
    ) {

        const bounds =
            new THREE.Box3()
            .setFromObject(
                object
            );


        const size =
            bounds.getSize(
                new THREE.Vector3()
            );


        // Ignore the giant ground collider.

        if(
            size.x > 50 &&
            size.z > 50
        ) {
            continue;
        }


        const nearest =
            new THREE.Vector3();


        bounds.clampPoint(
            p,
            nearest
        );


        const difference =
            new THREE.Vector3()
            .subVectors(
                p,
                nearest
            );


        /*
            If the body is inside a collider,
            choose a sensible outward direction.
        */

        if(
            difference.lengthSq() <
            .000001
        ) {

            const distances = [
                {
                    direction:
                        new THREE.Vector3(1,0,0),

                    distance:
                        Math.abs(
                            p.x -
                            bounds.max.x
                        )
                },
                {
                    direction:
                        new THREE.Vector3(-1,0,0),

                    distance:
                        Math.abs(
                            p.x -
                            bounds.min.x
                        )
                },
                {
                    direction:
                        new THREE.Vector3(0,0,1),

                    distance:
                        Math.abs(
                            p.z -
                            bounds.max.z
                        )
                },
                {
                    direction:
                        new THREE.Vector3(0,0,-1),

                    distance:
                        Math.abs(
                            p.z -
                            bounds.min.z
                        )
                }
            ];


            distances.sort(
                (a,b)=>
                    a.distance -
                    b.distance
            );


            difference.copy(
                distances[0].direction
            );
        }


        const distance =
            difference.length();


        if(
            distance >= bodyRadius
        ) {
            continue;
        }


        /*
            Landing on top.
        */

        if(
            p.y >=
            bounds.max.y - .65 &&
            velocity.y <= 0
        ) {

            p.y =
                bounds.max.y +
                bodyRadius;

            velocity.y = 0;

            grounded = true;

            continue;
        }


        /*
            Horizontal wall collision.
        */

        difference.y = 0;


        if(
            difference.lengthSq() >
            .000001
        ) {

            difference.normalize();


            const penetration =
                bodyRadius -
                distance;


            if(
                penetration > 0
            ) {

                p.addScaledVector(
                    difference,
                    penetration
                );
            }


            /*
                Remove only velocity going
                into the wall. Tangential
                momentum remains.
            */

            const wallVelocity =
                velocity.dot(
                    difference
                );


            if(
                wallVelocity < 0
            ) {

                velocity.addScaledVector(
                    difference,
                    -wallVelocity
                );
            }
        }
    }
}


// ============================================================
// VR CONTROLLERS
// ============================================================

const vrLeft =
    renderer.xr.getController(0);

const vrRight =
    renderer.xr.getController(1);

scene.add(vrLeft);
scene.add(vrRight);


let vrLeftGrip = false;
let vrRightGrip = false;


vrLeft.addEventListener(
    "selectstart",
    () => {
        vrLeftGrip = true;
    }
);

vrLeft.addEventListener(
    "selectend",
    () => {
        vrLeftGrip = false;
    }
);

vrRight.addEventListener(
    "selectstart",
    () => {
        vrRightGrip = true;
    }
);

vrRight.addEventListener(
    "selectend",
    () => {
        vrRightGrip = false;
    }
);


const previousVRLeft =
    new THREE.Vector3();

const previousVRRight =
    new THREE.Vector3();

let vrReady = false;


function updateVR() {

    if(
        !renderer.xr.isPresenting
    ) {
        vrReady = false;
        return;
    }


    const left =
        new THREE.Vector3();

    const right =
        new THREE.Vector3();


    vrLeft.getWorldPosition(
        left
    );

    vrRight.getWorldPosition(
        right
    );


    if(!vrReady) {

        previousVRLeft.copy(
            left
        );

        previousVRRight.copy(
            right
        );

        vrReady = true;

        return;
    }


    const leftMovement =
        new THREE.Vector3()
        .subVectors(
            left,
            previousVRLeft
        );


    const rightMovement =
        new THREE.Vector3()
        .subVectors(
            right,
            previousVRRight
        );


    /*
        Moving a gripping controller
        pushes the body in the opposite
        direction.
    */

    if(vrLeftGrip) {

        velocity.addScaledVector(
            leftMovement,
            -2.7
        );
    }


    if(vrRightGrip) {

        velocity.addScaledVector(
            rightMovement,
            -2.7
        );
    }


    previousVRLeft.copy(
        left
    );

    previousVRRight.copy(
        right
    );
}


// ============================================================
// CAMERA
// ============================================================

function updateCamera() {

    if(
        renderer.xr.isPresenting
    ) {
        return;
    }


    player.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;
}


// ============================================================
// RESPAWN
// ============================================================

function respawn() {

    player.position.set(
        0,
        3,
        8
    );

    velocity.set(
        0,
        0,
        0
    );

    yaw = 0;
    pitch = 0;
}


// ============================================================
// FALL
// ============================================================

function checkFall() {

    if(
        player.position.y <
        -15
    ) {

        respawn();
    }
}


// ============================================================
// BODY ANIMATION
// ============================================================

let animationTime = 0;

function animateBody(dt) {

    animationTime += dt;


    const speed =
        Math.hypot(
            velocity.x,
            velocity.z
        );


    if(
        speed > .7
    ) {

        body.position.y =
            -.45 +
            Math.sin(
                animationTime * 10
            ) * .035;

    } else {

        body.position.y =
            -.45;
    }
}


// ============================================================
// RESET INPUT AFTER FRAME
// ============================================================

function resetMouseDelta() {

    /*
        Important bug fix:

        Mouse movement is consumed once per
        frame instead of repeatedly applying
        the same movement.
    */

    mouseDX = 0;
    mouseDY = 0;
}


// ============================================================
// RESIZE
// ============================================================

addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


// ============================================================
// MAIN LOOP
// ============================================================

const clock =
    new THREE.Clock();


function loop() {

    const dt =
        Math.min(
            clock.getDelta(),
            .033
        );


    updateHands(dt);

    applyHandMovement();

    updateVR();

    updatePhysics(dt);

    resolveCollision();

    updateCamera();

    animateBody(dt);

    checkFall();

    renderer.render(
        scene,
        camera
    );


    resetMouseDelta();
}


renderer.setAnimationLoop(
    loop
);

</script>

</body>
</html>
